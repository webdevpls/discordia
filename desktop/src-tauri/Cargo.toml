[package]
name = "discordia"
version = "0.2.0"
description = "Discordia desktop"
authors = ["Vision Tech"]
license = "AGPL-3.0-only"
repository = "https://github.com/webdevpls/discordia"
edition = "2024"
rust-version = "1.90"

[lib]
name = "discordia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

# Binário pequeno: só a casca nativa, o app em si é a página web.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
