name: Release

# Ao criar uma tag v*, publica a imagem multi-arquitetura no GHCR e cria a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # App de Mac universal (Apple Silicon + Intel), assinado ad-hoc.
  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx electron-builder --mac --universal --publish never
      - name: Empacotar
        run: |
          APP=dist/mac-universal/Discordia.app
          codesign --verify --deep --strict "$APP"
          mkdir -p ../out
          ditto -c -k --keepParent "$APP" ../out/Discordia.zip
          cp dist/Discordia.dmg ../out/Discordia.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: desktop
          path: out

  release:
    needs: [image, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: out
      - name: Criar release com as notas do CHANGELOG e o app de Mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          (cd out && shasum -a 256 Discordia.zip Discordia.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag out/Discordia.zip out/Discordia.dmg out/SHA256SUMS.txt
